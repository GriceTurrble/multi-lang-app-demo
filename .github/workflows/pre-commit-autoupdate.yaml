## On a cron schedule or on demand, autoupdate the pre-commit config and create a draft PR with those changes.

name: pre-commit autoupdate

on:
  workflow_dispatch:
  schedule:
    # Every Mon 11AM UTC (~6AM US/Eastern)
    - cron: "0 11 * * 1"

jobs:
  pre-commit-autoupdate:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: griceturrble/precommit-autoupdate-action@301af7e8305b5c2969f3604843e8e55dc7db0e26 # v4.0.3
        with:
          pr_title: "[Draft] pre-commit autoupdate"
          python_version: "3.14"
