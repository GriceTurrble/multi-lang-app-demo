[project]
name = "fastapi-backend"
version = "0.1.0"
description = "FastAPI backend for the multi-lang-app-demo"
requires-python = ">=3.14"
dependencies = [
    "fastapi~=0.136.1",
    "uvicorn[standard]~=0.49.0",
    "asyncpg~=0.31.0",
    "pydantic[email]~=2.13.4",
    "pydantic-settings~=2.14.1",
    "uuid7-standard>=1.1.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "python-multipart>=0.0.29",
    "pgargs>=0.1.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pytest~=9.0.2",
    "pytest-cov~=7.1.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.pytest.ini_options]
addopts = """
--verbose
--cov=app
--no-cov-on-fail
--cov-branch
--cov-report=html:pytest_cov
--cov-report term-missing
--cov-report xml:code_coverage/coverage.xml
"""
