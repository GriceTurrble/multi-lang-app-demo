## Run the CI suite in PRs and on pushes to the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      # Defaults
      - opened
      - synchronize
      - reopened
      # Draft->ready
      - ready_for_review
      # Edit the title or top comment
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    # Elevating permissions for `contents` and `pull-requests` required
    # when using the `suggest_fixes` option:
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: griceturrble/precommit-checks-action@v3
        env:
          # `ty` local hooks don't work well in CI
          SKIP: "ty"
        with:
          # Use the fix suggestions.
          # This is also why this job is NOT skipped for draft PRs:
          suggest_fixes: true

  test-backends:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend:
          - fastapi
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install just runner
        uses: extractions/setup-just@v3

      - name: Install uv
        if: ${{ contains('fastapi', matrix.backend) }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install project dependencies
        working-directory: ./backends/${{ matrix.backend }}
        run: just sync

      - name: Run tests
        working-directory: ./backends/${{ matrix.backend }}
        run: just test

  test-frontends:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend:
          - nextjs
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install just runner
        uses: extractions/setup-just@v3

      - name: Setup Node
        if: ${{ contains('nextjs', matrix.frontend) }}
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./frontends/${{ matrix.frontend }}/package-lock.json

      - name: Install project dependencies
        working-directory: ./frontends/${{ matrix.frontend }}
        run: just sync

      - name: Run tests
        working-directory: ./frontends/${{ matrix.frontend }}
        run: just test

  test-mladmgmt:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test mladmgmt CLI
    runs-on: ubuntu-latest
    services:
      mysql:
        image: postgres:18
        # Health checks
        options: |
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      # - name: Setup PostgreSQL with pg_uuidv7
      #   run: |
      #     # Discover the pre-installed PostgreSQL major version
      #     PG_VERSION=$(pg_config --version | grep -oP '\d+' | head -1)
      #     # Install pg_uuidv7 from the PGDG apt repository
      #     sudo apt-get update -y
      #     sudo apt-get install -y postgresql-${PG_VERSION}-pg-uuidv7
      #     # Set a password and create a test database
      #     sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
      #     sudo -u postgres psql -c "CREATE DATABASE testdb;"
      #     # Install pg_uuidv7 in template1 so every test DB created by sqlx::test has it
      #     sudo -u postgres psql template1 -c "CREATE EXTENSION IF NOT EXISTS pg_uuidv7;"

      # - name: Install Rust toolchain
      #   uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mladmgmt/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mladmgmt/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: ./mladmgmt
        run: cargo test

  test-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test results
    runs-on: ubuntu-latest
    needs:
      - test-backends
      - test-frontends
      - test-mladmgmt
    steps:
      - run: echo "Tests passing!"
