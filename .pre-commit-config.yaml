default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
        exclude: \.vscode
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: "v1.7.12"
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.20"
    hooks:
      # backends/fastapi
      - name: ruff-check-backend-fastapi
        files: ^backends/fastapi/
        id: ruff-check
        args: [--fix]
        types_or: [python, pyi, jupyter]

      - name: ruff-format-backend-fastapi
        files: ^backends/fastapi/
        id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.25"
    hooks:
      # backends/fastapi
      - name: uv-lock-backend-fastapi
        files: ^backends/fastapi/
        id: uv-lock
        entry: pre-commit hazmat cd backends/fastapi uv lock --
        args: []

      - name: uv-sync-backend-fastapi
        files: ^backends/fastapi/
        id: uv-sync
        entry: pre-commit hazmat cd backends/fastapi uv sync --locked --all-groups --
        args: []

  - repo: local
    hooks:
      # Requires GITHUB_TOKEN env var to avoid API rate limits
      - id: pin-github-action
        name: pin-github-action-shas
        language: node
        entry: pin-github-action
        additional_dependencies: ["pin-github-action"]
        files: ^\.github/workflows/
        types_or: [yaml]

      - id: ty
        name: ty-check-fastapi
        entry: pre-commit hazmat cd backends/fastapi uv run ty check . --python .venv --
        pass_filenames: false
        always_run: true
        language: system
        args: []

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-footnote
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.9.1"
    hooks:
      - id: prettier
        types_or: [json, yaml]
