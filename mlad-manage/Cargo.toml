[workspace]
members = ["mlad-manage-adr-lib"]

[package]
name = "mlad-manage"
version = "0.1.0"
edition = "2024"

[dependencies]
mlad-manage-adr-lib = { path = "mlad-manage-adr-lib" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", features = ["clock"] }
dotenvy = "0.15"
rpassword = "7"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
