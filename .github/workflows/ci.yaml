## Run the CI suite in PRs and on pushes to the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      # Defaults
      - opened
      - synchronize
      - reopened
      # Draft->ready
      - ready_for_review
      # Edit the title or top comment
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    # Elevating permissions for `contents` and `pull-requests` required
    # when using the `suggest_fixes` option:
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: griceturrble/precommit-checks-action@d18ef4bd0b3de2975597dab28b9e55fcc783c9fd # v3.0.3
        env:
          # `ty` local hooks don't work well in CI
          SKIP: "ty"
        with:
          # Use the fix suggestions.
          # This is also why this job is NOT skipped for draft PRs:
          suggest_fixes: true

  test-backend-fastapi:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backend - FastAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"

      - name: Install project dependencies
        working-directory: ./backends/fastapi
        run: just sync

      - name: Run tests
        working-directory: ./backends/fastapi
        run: just test

  test-frontend-nextjs:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontend - NextJS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./frontends/nextjs/package-lock.json

      - name: Install project dependencies
        working-directory: ./frontends/nextjs
        run: just sync

      - name: Run tests
        working-directory: ./frontends/nextjs
        # Test with coverage report:
        run: just test-coverage

  test-mlad-manage:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test mlad-manage CLI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        # Health checks
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlad
    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup database
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE mlad;"

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mlad-manage/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mlad-manage/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: ./mlad-manage
        run: cargo test --workspace

  test-integration:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test - integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./integration/package-lock.json

      - name: Install Playwright and dependencies
        working-directory: ./integration
        run: just bootstrap

      - name: Start test stack
        run: docker compose -f compose.test.yaml up -d --build --wait

      - name: Run database migrations
        working-directory: mlad-manage
        run: cargo run -- db migrate run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mlad

      - name: Run integration tests
        working-directory: ./integration
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: integration/playwright-report/

      - name: Tear down test stack
        if: always()
        run: docker compose -f compose.test.yaml down --remove-orphans

  test-backends-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backends - result
    runs-on: ubuntu-latest
    needs:
      - test-backend-fastapi
    steps:
      - run: echo "Tests passing!"

  test-frontends-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontends - result
    runs-on: ubuntu-latest
    needs:
      - test-frontend-nextjs
    steps:
      - run: echo "Tests passing!"

  test-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test results
    runs-on: ubuntu-latest
    needs:
      - test-backends-result
      - test-frontends-result
      - test-mlad-manage
      - test-integration
    steps:
      - run: echo "Tests passing!"
