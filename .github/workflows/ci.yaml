## Run the CI suite in PRs and on pushes to the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      # Defaults
      - opened
      - synchronize
      - reopened
      # Draft->ready
      - ready_for_review
      # Edit the title or top comment
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    # Elevating permissions for `contents` and `pull-requests` required
    # when using the `suggest_fixes` option:
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: griceturrble/precommit-checks-action@b4eb4140b330f998d6cef701a78213ca41c4d7a5 # v3
        env:
          # `ty` local hooks don't work well in CI
          SKIP: "ty"
        with:
          # Use the fix suggestions.
          # This is also why this job is NOT skipped for draft PRs:
          suggest_fixes: true

  test-backend-fastapi:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backend - FastAPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install just runner
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.14"

      - name: Install project dependencies
        working-directory: ./backends/fastapi
        run: just sync

      - name: Run tests
        working-directory: ./backends/fastapi
        run: just test

  test-frontend-nextjs:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontend - NextJS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install just runner
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./frontends/nextjs/package-lock.json

      - name: Install project dependencies
        working-directory: ./frontends/nextjs
        run: just sync

      - name: Run tests
        working-directory: ./frontends/nextjs
        # Test with coverage report:
        run: just test-coverage

  test-mlad-manage:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test mlad-manage CLI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        # Health checks
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup database
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE testdb;"

      - name: Cache Rust dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mlad-manage/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mlad-manage/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: ./mlad-manage
        run: cargo test --workspace

  test-integration:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test - integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install just runner
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 25
          cache: "npm"
          cache-dependency-path: ./integration/package-lock.json

      - name: Install Playwright and dependencies
        working-directory: ./integration
        run: just bootstrap

      - name: Start test stack
        run: docker compose -f compose.test.yaml up -d --build --wait

      - name: Run integration tests
        working-directory: ./integration
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: integration/playwright-report/

      - name: Tear down test stack
        if: always()
        run: docker compose -f compose.test.yaml down --remove-orphans

  test-backends-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backends - result
    runs-on: ubuntu-latest
    needs:
      - test-backend-fastapi
    steps:
      - run: echo "Tests passing!"

  test-frontends-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontends - result
    runs-on: ubuntu-latest
    needs:
      - test-frontend-nextjs
    steps:
      - run: echo "Tests passing!"

  test-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test results
    runs-on: ubuntu-latest
    needs:
      - test-backends-result
      - test-frontends-result
      - test-mlad-manage
      - test-integration
    steps:
      - run: echo "Tests passing!"
