## Run the CI suite in PRs and on pushes to the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      # Defaults
      - opened
      - synchronize
      - reopened
      # Draft->ready
      - ready_for_review
      # Edit the title or top comment
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    # Elevating permissions for `contents` and `pull-requests` required
    # when using the `suggest_fixes` option:
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: griceturrble/precommit-checks-action@v3
        env:
          # `ty` local hooks don't work well in CI
          SKIP: "ty"
        with:
          # Use the fix suggestions.
          # This is also why this job is NOT skipped for draft PRs:
          suggest_fixes: true

  test-backend-fastapi:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install just runner
        uses: extractions/setup-just@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install project dependencies
        working-directory: ./backends/fastapi
        run: just sync

      - name: Run tests
        working-directory: ./backends/fastapi
        run: just test

  test-frontend-nextjs:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install just runner
        uses: extractions/setup-just@v3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./frontends/nextjs/package-lock.json

      - name: Install project dependencies
        working-directory: ./frontends/nextjs
        run: just sync

      - name: Run tests
        working-directory: ./frontends/nextjs
        run: just test

  test-mlad-manage:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test mlad-manage CLI
    runs-on: ubuntu-latest
    services:
      mysql:
        image: postgres:18
        # Health checks
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Setup database
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE testdb;"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mlad-manage/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mlad-manage/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests
        working-directory: ./mlad-manage
        run: cargo test --workspace

  test-backends-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test backend results
    runs-on: ubuntu-latest
    needs:
      - test-backend-fastapi
    steps:
      - run: echo "Tests passing!"

  test-frontends-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test frontend results
    runs-on: ubuntu-latest
    needs:
      - test-frontend-nextjs
    steps:
      - run: echo "Tests passing!"

  test-result:
    if: ${{ !github.event.pull_request || (!github.event.pull_request.draft && !contains(github.event.pull_request.title, '[draft]')) }}
    name: Test results
    runs-on: ubuntu-latest
    needs:
      - test-backends-result
      - test-frontends-result
      - test-mlad-manage
    steps:
      - run: echo "Tests passing!"
